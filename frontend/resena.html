<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>try{if(localStorage.getItem('barber-tema')==='claro')document.documentElement.setAttribute('data-tema','claro')}catch(e){}</script>
    <title>Deja tu Reseña — Barber Registro</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(28px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes popIn {
            0%   { opacity: 0; transform: scale(.7); }
            70%  { transform: scale(1.08); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes spinIn {
            from { opacity: 0; transform: rotate(-180deg) scale(.5); }
            to   { opacity: 1; transform: rotate(0deg) scale(1); }
        }

        .resena-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .resena-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px 36px;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 8px 40px rgba(0,0,0,.25);
        }

        @media (max-width: 480px) {
            .resena-card { padding: 28px 20px; border-radius: 16px; }
        }

        /* Icono central animado */
        .icono-central {
            width: 72px; height: 72px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 16px;
            font-size: 30px;
            animation: popIn .5s cubic-bezier(.34,1.56,.64,1) both;
        }

        .resena-titulo {
            text-align: center;
            margin-bottom: 4px;
            animation: fadeUp .4s .1s ease both;
        }
        .resena-sub {
            text-align: center;
            color: var(--text-3);
            font-size: 14px;
            margin-bottom: 28px;
            animation: fadeUp .4s .15s ease both;
        }

        /* Estrellas */
        .star-wrap {
            display: flex;
            justify-content: center;
            gap: 6px;
            font-size: 36px;
            margin: 8px 0 16px;
            flex-direction: row-reverse;
        }
        .star-wrap input { display: none; }
        .star-wrap label {
            cursor: pointer;
            color: var(--border);
            transition: color .15s, transform .15s;
        }
        .star-wrap label:hover,
        .star-wrap label:hover ~ label,
        .star-wrap input:checked ~ label { color: var(--accent); }
        .star-wrap label:hover { transform: scale(1.2); }

        /* Campos con animación escalonada */
        .campo-1 { animation: fadeUp .4s .2s ease both; }
        .campo-2 { animation: fadeUp .4s .3s ease both; }
        .campo-3 { animation: fadeUp .4s .4s ease both; }
        .campo-4 { animation: fadeUp .4s .5s ease both; }

        /* Error */
        .error-icon {
            width: 72px; height: 72px;
            background: #e53e3e; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px; font-size: 28px; color: #fff;
            animation: popIn .5s cubic-bezier(.34,1.56,.64,1) both;
        }

        /* Éxito check */
        .check-icon {
            width: 80px; height: 80px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px; font-size: 34px; color: #fff;
            animation: spinIn .6s cubic-bezier(.34,1.56,.64,1) both;
        }

        /* Botón usa color de la barbería */
        .btn-barberia {
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 12px;
            padding: 14px;
            width: 100%;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: opacity .2s, transform .15s;
        }
        .btn-barberia:hover:not(:disabled) { opacity: .88; transform: translateY(-1px); }
        .btn-barberia:disabled { opacity: .6; cursor: not-allowed; }

        .exito-texto { animation: fadeUp .4s .3s ease both; }
        .exito-btn   { animation: fadeUp .4s .45s ease both; display:inline-flex; }
    </style>
</head>
<body>

<div id="toastContainer" aria-live="polite"></div>

<div class="resena-wrap">
    <div class="resena-card">

        <!-- Cargando -->
        <div id="estadoCargando" style="text-align:center;padding:40px 0;">
            <span class="loading" style="width:36px;height:36px;border-width:3px;"></span>
            <p style="color:var(--text-3);margin-top:16px;">Cargando...</p>
        </div>

        <!-- Error -->
        <div id="estadoError" style="display:none;text-align:center;padding:40px 0;">
            <div class="error-icon"><i class="fas fa-times"></i></div>
            <h2 style="animation:fadeUp .4s .1s ease both;">Link inválido</h2>
            <p style="color:var(--text-3);animation:fadeUp .4s .2s ease both;">Este link de reseña no es válido o ya expiró.</p>
        </div>

        <!-- Formulario -->
        <div id="estadoForm" style="display:none;">
            <div class="icono-central" id="iconoBarberia">
                <i class="fas fa-star"></i>
            </div>
            <h2 id="tituloBarberia" class="resena-titulo"></h2>
            <p class="resena-sub">¿Cómo fue tu experiencia?</p>

            <form id="resenaForm">
                <div class="form-group campo-1">
                    <label for="cliente_nombre">Tu Nombre *</label>
                    <input type="text" id="cliente_nombre" class="form-control" required placeholder="Tu nombre">
                </div>

                <div class="form-group campo-2">
                    <label>Calificación *</label>
                    <div class="star-wrap" role="radiogroup" aria-label="Calificación">
                        <input type="radio" id="s5" name="cal" value="5"><label for="s5">&#9733;</label>
                        <input type="radio" id="s4" name="cal" value="4"><label for="s4">&#9733;</label>
                        <input type="radio" id="s3" name="cal" value="3"><label for="s3">&#9733;</label>
                        <input type="radio" id="s2" name="cal" value="2"><label for="s2">&#9733;</label>
                        <input type="radio" id="s1" name="cal" value="1"><label for="s1">&#9733;</label>
                    </div>
                </div>

                <div class="form-group campo-3">
                    <label for="comentario">Comentario *</label>
                    <textarea id="comentario" class="form-control" required
                        placeholder="Cuéntanos cómo fue tu visita..."
                        style="min-height:100px;resize:vertical;"></textarea>
                </div>

                <div class="campo-4">
                    <button type="submit" id="btnEnviar" class="btn-barberia">
                        <i class="fas fa-paper-plane"></i> Enviar Reseña
                    </button>
                </div>
            </form>
        </div>

        <!-- Éxito -->
        <div id="estadoExito" style="display:none;text-align:center;padding:32px 0;">
            <div class="check-icon" id="checkIcon">
                <i class="fas fa-check"></i>
            </div>
            <h2 class="exito-texto" style="margin-bottom:8px;">¡Gracias por tu reseña!</h2>
            <p class="exito-texto" style="color:var(--text-3);margin-bottom:28px;">
                Tu opinión ayuda a otros clientes a encontrarnos.
            </p>
            <a id="linkBarberia" href="#" class="btn-barberia exito-btn" style="width:auto;padding:12px 28px;text-decoration:none;">
                <i class="fas fa-cut"></i> Ver la Barbería
            </a>
        </div>

    </div>
</div>

<script type="module">
    import { config } from './assets/js/config.js';
    import { toast } from './assets/js/utils.js';

    const params  = new URLSearchParams(location.search);
    const codigo  = params.get('codigo');
    const nombre  = params.get('nombre') || '';

    const ESTADOS = ['estadoCargando','estadoError','estadoForm','estadoExito'];
    function show(id) {
        ESTADOS.forEach(s => {
            const el = document.getElementById(s);
            if (s === id) {
                el.style.display = '';
                // Reinicia animaciones hijas
                el.querySelectorAll('[style*="animation"], [class*="campo"], [class*="resena-"], [class*="icono"], [class*="check"], [class*="error"], [class*="exito"]')
                  .forEach(c => { c.style.animation = 'none'; c.offsetHeight; c.style.animation = ''; });
            } else {
                el.style.display = 'none';
            }
        });
    }

    function aplicarColor(hex) {
        if (!hex) return;
        document.documentElement.style.setProperty('--accent', hex);
        // Color de texto sobre el botón (negro si color claro, blanco si oscuro)
        const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
        const lum = (0.299*r + 0.587*g + 0.114*b) / 255;
        document.querySelectorAll('.btn-barberia').forEach(b => b.style.color = lum > 0.5 ? '#000' : '#fff');
        document.getElementById('iconoBarberia').style.background = hex;
        document.getElementById('checkIcon').style.background = hex;
    }

    if (!codigo) {
        show('estadoError');
    } else {
        fetch(`${config.apiURL}/barberias/${codigo}`)
            .then(r => r.ok ? r.json() : Promise.reject())
            .then(d => {
                document.getElementById('tituloBarberia').textContent = d.nombre;
                document.getElementById('cliente_nombre').value = nombre;
                document.getElementById('linkBarberia').href = `barberia.html?codigo=${codigo}`;
                aplicarColor(d.tema_color);
                show('estadoForm');
            })
            .catch(() => show('estadoError'));
    }

    document.getElementById('resenaForm').addEventListener('submit', async e => {
        e.preventDefault();
        const cal = document.querySelector('input[name="cal"]:checked');
        if (!cal) { toast('Selecciona una calificación', 'error'); return; }
        const btn = document.getElementById('btnEnviar');
        btn.disabled = true;
        btn.innerHTML = '<span class="loading" style="width:18px;height:18px;border-width:2px;border-color:currentColor transparent transparent transparent;"></span> Enviando...';
        try {
            const r = await fetch(`${config.apiURL}/barberias/${codigo}/resenas`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    cliente_nombre: document.getElementById('cliente_nombre').value.trim(),
                    comentario:     document.getElementById('comentario').value.trim(),
                    calificacion:   parseInt(cal.value)
                })
            });
            const d = await r.json();
            if (!r.ok) throw new Error(d.error || 'Error');
            show('estadoExito');
        } catch (err) {
            toast(err.message, 'error');
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-paper-plane"></i> Enviar Reseña';
        }
    });
</script>
</body>
</html>
