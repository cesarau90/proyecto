<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>try{if(localStorage.getItem('barber-tema')==='claro')document.documentElement.setAttribute('data-tema','claro')}catch(e){}</script>
    <title>Recuperar Contraseña — Barber Registro</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/recuperar.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <button id="btnTema" class="btn-tema" title="Cambiar tema" aria-label="Cambiar tema" style="position:fixed;top:16px;right:16px;z-index:50;"><i class="fas fa-sun" id="iconTema"></i></button>
    <div class="bg-deco"><span></span><span></span></div>

    <div class="login-wrap">
        <div class="login-brand">
            <div class="scissors"><i class="fas fa-cut"></i></div>
            <h1>Barber <span>Registro</span></h1>
            <p>Recuperar contraseña</p>
        </div>

        <div class="login-card">
            <div id="msgRecuperar" role="alert"></div>

            <!-- Paso 1: email -->
            <div id="paso1">
                <p style="font-size:13px;color:var(--text-3);margin-bottom:20px;">Ingresa tu email y te enviaremos un código de 6 dígitos para restablecer tu contraseña.</p>
                <div class="form-group">
                    <label for="recEmail">Email de tu cuenta</label>
                    <input type="email" id="recEmail" class="form-control" placeholder="tu@email.com" autofocus>
                </div>
                <button onclick="enviarCodigo()" id="btnEnviarCodigo" class="btn btn-primary login-submit">
                    <i class="fas fa-paper-plane"></i> Enviar código
                </button>
            </div>

            <!-- Paso 2: código + nueva contraseña -->
            <div id="paso2" style="display:none;">
                <p style="font-size:13px;color:var(--text-3);margin-bottom:20px;">Revisa tu correo e ingresa el código de 6 dígitos junto con tu nueva contraseña.</p>
                <div class="form-group">
                    <label for="recCodigo">Código de verificación</label>
                    <input type="text" id="recCodigo" class="form-control" placeholder="000000" maxlength="6" inputmode="numeric" style="letter-spacing:6px;font-size:22px;text-align:center;font-weight:700;">
                </div>
                <div class="form-group">
                    <label for="recPassword">Nueva contraseña</label>
                    <div class="pw-wrap">
                        <input type="password" id="recPassword" class="form-control" placeholder="Mínimo 6 caracteres">
                        <button type="button" class="toggle-pw" onclick="toggleRecPw()" aria-label="Mostrar contraseña"><i class="fas fa-eye" id="eyeRec"></i></button>
                    </div>
                </div>
                <button onclick="resetearPassword()" id="btnResetear" class="btn btn-primary login-submit">
                    <i class="fas fa-lock"></i> Restablecer contraseña
                </button>
            </div>

            <p style="text-align:center;margin-top:16px;margin-bottom:0;">
                <a href="login.html" class="btn-link-simple"><i class="fas fa-arrow-left"></i> Volver al login</a>
            </p>
        </div>

        <div class="login-footer">Sistema de reservas · Barber Registro</div>
    </div>

    <script type="module">
        import { config } from './assets/js/config.js';
        import { initTema } from './assets/js/utils.js';
        initTema();

        document.getElementById('recEmail').addEventListener('keydown', e => { if (e.key === 'Enter') enviarCodigo(); });
        document.getElementById('recCodigo') .addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('recPassword').focus(); });
        document.getElementById('recPassword').addEventListener('keydown', e => { if (e.key === 'Enter') resetearPassword(); });

        window.toggleRecPw = function() {
            const i = document.getElementById('recPassword'), ic = document.getElementById('eyeRec');
            i.type = i.type === 'password' ? 'text' : 'password';
            ic.className = i.type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
        };

        let _recEmail = '';

        window.enviarCodigo = async function() {
            const email = document.getElementById('recEmail').value.trim();
            const msg = document.getElementById('msgRecuperar');
            if (!email) { msg.innerHTML = '<div class="alert alert-error"><i class="fas fa-exclamation-circle"></i> Ingresa tu email</div>'; return; }
            const btn = document.getElementById('btnEnviarCodigo');
            btn.disabled = true; btn.innerHTML = '<span class="loading"></span> Enviando...';
            msg.innerHTML = '';
            try {
                const r = await fetch(`${config.apiURL}/auth/forgot-password`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email })
                });
                const d = await r.json();
                if (!r.ok) throw new Error(d.error || 'Error');
                _recEmail = email;
                document.getElementById('paso1').style.display = 'none';
                document.getElementById('paso2').style.display = '';
                msg.innerHTML = '<div class="alert alert-success"><i class="fas fa-check-circle"></i> Código enviado. Revisa tu correo.</div>';
                document.getElementById('recCodigo').focus();
            } catch(e) {
                msg.innerHTML = `<div class="alert alert-error"><i class="fas fa-exclamation-circle"></i> ${e.message}</div>`;
            } finally {
                btn.disabled = false; btn.innerHTML = '<i class="fas fa-paper-plane"></i> Enviar código';
            }
        };

        window.resetearPassword = async function() {
            const codigo = document.getElementById('recCodigo').value.trim();
            const nueva  = document.getElementById('recPassword').value;
            const msg    = document.getElementById('msgRecuperar');
            if (!codigo || !nueva) { msg.innerHTML = '<div class="alert alert-error"><i class="fas fa-exclamation-circle"></i> Completa todos los campos</div>'; return; }
            if (nueva.length < 6)  { msg.innerHTML = '<div class="alert alert-error"><i class="fas fa-exclamation-circle"></i> Mínimo 6 caracteres</div>'; return; }
            const btn = document.getElementById('btnResetear');
            btn.disabled = true; btn.innerHTML = '<span class="loading"></span> Restableciendo...';
            msg.innerHTML = '';
            try {
                const r = await fetch(`${config.apiURL}/auth/reset-password`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: _recEmail, codigo, nueva_password: nueva })
                });
                const d = await r.json();
                if (!r.ok) throw new Error(d.error || 'Error');
                msg.innerHTML = '<div class="alert alert-success"><i class="fas fa-check-circle"></i> ¡Contraseña restablecida! Redirigiendo...</div>';
                setTimeout(() => window.location.href = 'login.html', 2000);
            } catch(e) {
                msg.innerHTML = `<div class="alert alert-error"><i class="fas fa-exclamation-circle"></i> ${e.message}</div>`;
            } finally {
                btn.disabled = false; btn.innerHTML = '<i class="fas fa-lock"></i> Restablecer contraseña';
            }
        };
    </script>
</body>
</html>
